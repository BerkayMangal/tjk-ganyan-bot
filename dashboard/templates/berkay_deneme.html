<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 BERKAY DENEME</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 sans-serif;
    background: #0d1117; color: #e6edf3; margin: 0;
    padding: 12px; line-height: 1.45;
  }
  main { max-width: 980px; margin: 0 auto; }

  /* HEADER */
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
  }
  h1 {
    font-size: 1.2em; margin: 0;
    display: flex; align-items: center; gap: 6px;
  }
  .sub { font-size: 0.78em; color: #8b949e; margin-top: 2px; }
  .controls { display: flex; gap: 6px; align-items: center; }
  input[type=date], button {
    background: #21262d; color: #e6edf3;
    border: 1px solid #30363d; padding: 6px 10px;
    border-radius: 6px; font-size: 0.85em; cursor: pointer;
  }
  button:hover { background: #30363d; }
  button:disabled { opacity: 0.5; cursor: wait; }

  /* STATS GRID */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-bottom: 16px;
  }
  .stat {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 10px; text-align: center;
  }
  .stat .n { font-size: 1.7em; font-weight: 700; line-height: 1.1; }
  .stat .l { font-size: 0.7em; color: #8b949e;
             text-transform: uppercase; letter-spacing: 0.04em;
             margin-top: 3px; }
  .stat.banker .n { color: #56d364; }
  .stat.value  .n { color: #58a6ff; }
  .stat.avoid  .n { color: #f85149; }
  .stat.skip   .n { color: #8b949e; }

  /* MAIN TABLE */
  .section {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; margin-bottom: 14px; overflow: hidden;
  }
  .section h2 {
    font-size: 0.95em; margin: 0; padding: 11px 14px;
    border-bottom: 1px solid #30363d;
    background: #1f2630;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section .body { padding: 0; }

  .picks-table {
    width: 100%; border-collapse: collapse; font-size: 0.85em;
  }
  .picks-table th {
    background: #1f2630; color: #8b949e; font-size: 0.7em;
    text-align: left; padding: 7px 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    border-bottom: 1px solid #30363d;
  }
  .picks-table td {
    padding: 9px 10px; border-bottom: 1px solid #21262d;
    vertical-align: middle;
  }
  .picks-table tr:last-child td { border-bottom: none; }
  .picks-table tr.won { background: rgba(86, 211, 100, 0.08); }
  .picks-table tr.lost { background: rgba(248, 81, 73, 0.05); }
  .kind-cell {
    font-size: 1.05em; width: 30px; text-align: center;
  }
  .pick-horse { font-weight: 600; }
  .pick-meta {
    color: #8b949e; font-size: 0.82em;
  }
  .pick-reason { color: #c9d1d9; font-size: 0.85em; }
  .pick-outcome { text-align: center; width: 50px; font-weight: 700; }
  .pick-outcome.won { color: #56d364; }
  .pick-outcome.lost { color: #f85149; }
  .pick-outcome.pending { color: #6e7681; }

  .tier-badge {
    display: inline-block; padding: 1px 5px; border-radius: 4px;
    font-size: 0.65em; font-weight: 700;
    margin-left: 4px; vertical-align: middle;
  }
  .tier-DIAMOND { background: #ffd700; color: #1c1c1c; }
  .tier-ALTIN { background: #f0883e; color: #1c1c1c; }
  .tier-PREMIUM { background: #58a6ff; color: #1c1c1c; }
  .tier-FIRSAT { background: #a371f7; color: white; }

  /* DETAILS COLLAPSIBLES */
  details {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; margin-bottom: 8px; overflow: hidden;
  }
  details summary {
    cursor: pointer; padding: 12px 14px;
    font-size: 0.9em; user-select: none;
    list-style: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before {
    content: "▶"; color: #8b949e; margin-right: 8px;
    transition: transform 0.2s;
  }
  details[open] summary::before { transform: rotate(90deg); }
  details .content { padding: 0 14px 14px; }
  details .count {
    background: #21262d; color: #8b949e;
    padding: 1px 8px; border-radius: 10px; font-size: 0.78em;
  }

  /* COUPON TEXT */
  .coupon-text {
    background: #0a0e13; border: 1px solid #21262d;
    border-radius: 6px; padding: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78em; line-height: 1.4;
    white-space: pre-wrap; word-break: break-word;
    max-height: 400px; overflow-y: auto; color: #c9d1d9;
  }
  .telegram-msg { margin-bottom: 10px; }
  .telegram-msg .head {
    font-weight: 600; font-size: 0.85em; color: #58a6ff;
    margin-bottom: 4px;
  }

  /* HISTORY MINI-TABLE */
  .history-table {
    width: 100%; border-collapse: collapse; font-size: 0.82em;
  }
  .history-table th, .history-table td {
    padding: 6px 8px; border-bottom: 1px solid #21262d;
  }
  .history-table th {
    background: #1f2630; color: #8b949e; text-align: left;
    font-size: 0.72em; font-weight: 600;
  }

  /* EMPTY STATES */
  .empty {
    text-align: center; padding: 18px; color: #8b949e;
    font-size: 0.88em; font-style: italic;
  }
  .loading::after {
    content: "…"; display: inline-block;
    animation: dots 1.4s infinite;
  }
  @keyframes dots { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }

  .disclaimer {
    text-align: center; color: #6e7681; font-size: 0.74em;
    font-style: italic; margin-top: 20px; padding: 10px;
  }

  /* MOBILE */
  @media (max-width: 640px) {
    body { padding: 8px; }
    h1 { font-size: 1.05em; }
    .stats { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .stat .n { font-size: 1.4em; }
    .picks-table th, .picks-table td { padding: 6px 6px; font-size: 0.78em; }
    .picks-table .pick-reason { display: none; }
    .section h2 { font-size: 0.85em; padding: 9px 10px; }
  }
</style>
</head>
<body>
<main>

<header>
  <div>
    <h1>🧪 BERKAY DENEME</h1>
    <div class="sub" id="date-display">…</div>
  </div>
  <div class="controls">
    <input type="date" id="date-picker">
    <button id="refresh-btn">↻</button>
  </div>
</header>

<!-- 4 BIG STATS -->
<div class="stats">
  <div class="stat banker">
    <div class="n" id="stat-banker">…</div>
    <div class="l">⭐ Ana At</div>
  </div>
  <div class="stat value">
    <div class="n" id="stat-value">…</div>
    <div class="l">💎 Değer</div>
  </div>
  <div class="stat avoid">
    <div class="n" id="stat-avoid">…</div>
    <div class="l">⚠ Tuzak</div>
  </div>
  <div class="stat skip">
    <div class="n" id="stat-skip">…</div>
    <div class="l">🛑 Pas</div>
  </div>
</div>

<!-- MAIN PICKS TABLE -->
<div class="section">
  <h2>
    🎯 Bugünkü Picks
    <span id="picks-result">…</span>
  </h2>
  <div class="body" id="picks-body">
    <div class="empty loading">Yükleniyor</div>
  </div>
</div>

<!-- HISTORY -->
<div class="section">
  <h2>
    📈 Son 14 Gün
    <span id="hist-count" style="font-size: 0.75em; color: #8b949e;">…</span>
  </h2>
  <div class="body" id="hist-body">
    <div class="empty loading">Yükleniyor</div>
  </div>
</div>

<!-- DETAILS -->
<details id="det-telegram">
  <summary>
    <span>📨 Telegram'a giden mesajlar</span>
    <span class="count" id="tg-count">…</span>
  </summary>
  <div class="content" id="tg-content">
    <div class="empty">Yükleniyor…</div>
  </div>
</details>

<details id="det-allraces">
  <summary>
    <span>🐎 Tüm yarış detayları (MP/AGF/tier)</span>
    <span class="count" id="model-count">…</span>
  </summary>
  <div class="content" id="model-content">
    <div class="empty">Yükleniyor…</div>
  </div>
</details>

<details id="det-sib">
  <summary>
    <span>📊 SİB BUNU OYNA picks (canlı tetik)</span>
    <span class="count" id="sib-count">…</span>
  </summary>
  <div class="content">
    <div style="margin-bottom: 8px;">
      <button id="sib-refresh-btn">↻ Bugünün SİB picks'lerini canlı çek (~30s)</button>
      <span id="sib-status" style="margin-left: 8px; font-size: 0.8em; color: #8b949e;"></span>
    </div>
    <div id="sib-content">
      <div class="empty">Henüz çekilmedi.</div>
    </div>
  </div>
</details>

<div class="disclaimer" id="disclaimer">…</div>

</main>

<script>
function $(id) { return document.getElementById(id); }
function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) Object.assign(e, props);
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}
function fmtTrDate(s) {
  if (!s) return "";
  const months = ["Oca","Şub","Mar","Nis","May","Haz",
                  "Tem","Ağu","Eyl","Eki","Kas","Ara"];
  const days = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
  try {
    const d = new Date(s);
    return d.getDate() + " " + months[d.getMonth()] + " "
           + days[d.getDay()];
  } catch (e) { return s; }
}
function pct(n, den) {
  if (!den || den <= 0) return "—";
  return Math.round(100 * n / den) + "%";
}

const KIND_ICON = {
  banker: "⭐", value: "💎", chaos: "🎲", avoid: "⚠", no_bet: "🛑",
};
const KIND_LABEL = {
  banker: "Ana At", value: "Değer", chaos: "Şans",
  avoid: "Tuzak", no_bet: "PAS",
};

function renderHeader(date) {
  $("date-display").textContent = fmtTrDate(date)
    + " · Deneme · oto-bahis yok";
}

function renderStats(s) {
  if (!s) {
    $("stat-banker").textContent = "0";
    $("stat-value").textContent = "0";
    $("stat-avoid").textContent = "0";
    $("stat-skip").textContent = "0";
    return;
  }
  $("stat-banker").textContent = s.banker_count || 0;
  $("stat-value").textContent = s.value_count || 0;
  $("stat-avoid").textContent = s.avoid_count || 0;
  $("stat-skip").textContent = s.no_bet || 0;
  const w = s.won || 0, l = s.lost || 0, p = s.pending || 0;
  if (w || l) {
    $("picks-result").innerHTML =
      `<span style="color:#56d364;font-size:0.78em;">✓ ${w}</span>
       <span style="color:#f85149;font-size:0.78em;margin-left:8px;">✗ ${l}</span>
       <span style="color:#8b949e;font-size:0.78em;margin-left:8px;">⏳ ${p}</span>`;
  } else {
    $("picks-result").innerHTML =
      `<span style="color:#8b949e;font-size:0.78em;">⏳ ${p} bekleniyor</span>`;
  }
}

function renderPicks(picks) {
  const body = $("picks-body");
  body.innerHTML = "";
  if (!picks || picks.length === 0) {
    body.appendChild(el("div", {
      className: "empty",
      textContent: "Bugün için pick yok ya da pipeline henüz çalışmadı.",
    }));
    return;
  }
  const tbl = el("table", { className: "picks-table" });
  const thead = el("thead");
  thead.appendChild(el("tr", null,
    el("th", { textContent: "" }),  // icon
    el("th", { textContent: "Yarış" }),
    el("th", { textContent: "At" }),
    el("th", { textContent: "AGF" }),
    el("th", { textContent: "Sebep" }),
    el("th", { textContent: "Sonuç", style: "text-align:center;" }),
  ));
  tbl.appendChild(thead);
  const tbody = el("tbody");
  for (const p of picks) {
    const won = (p.outcome || {}).won;
    let trCls = "";
    if (won === true) trCls = "won";
    else if (won === false) trCls = "lost";

    const horseCell = p.horse_no == null
      ? el("td", null, el("span", { className: "pick-meta", textContent: "—" }))
      : el("td", null,
          el("div", { className: "pick-horse",
            textContent: "#" + p.horse_no + " " + (p.horse_name || "?") }),
          p.tier
            ? el("span", {
                className: "tier-badge tier-" + p.tier,
                textContent: p.tier,
              })
            : null,
        );

    const raceCell = el("td", null,
      el("div", { textContent: (p.race_time || "") }),
      el("div", { className: "pick-meta",
        textContent: (p.hippo || "?") + " " + (p.race_no || "?") + ".k" }),
    );

    let outcomeCell;
    if (p.kind === "no_bet") {
      outcomeCell = el("td", { className: "pick-outcome pending",
        textContent: "—" });
    } else if (won === true) {
      outcomeCell = el("td", { className: "pick-outcome won",
        textContent: "✓" });
    } else if (won === false) {
      outcomeCell = el("td", { className: "pick-outcome lost",
        textContent: "✗" });
    } else {
      outcomeCell = el("td", { className: "pick-outcome pending",
        textContent: "—" });
    }

    tbody.appendChild(el("tr", { className: trCls },
      el("td", { className: "kind-cell",
        textContent: KIND_ICON[p.kind] || "" }),
      raceCell,
      horseCell,
      el("td", null,
        el("span", { className: "pick-meta",
          textContent: p.agf != null ? "%" + p.agf.toFixed(0) : "—" }),
      ),
      el("td", { className: "pick-reason",
        textContent: p.reason || "" }),
      outcomeCell,
    ));
  }
  tbl.appendChild(tbody);
  body.appendChild(tbl);
}

function renderHistory(data) {
  const box = $("hist-body");
  box.innerHTML = "";
  if (!data.rows || data.rows.length === 0) {
    box.appendChild(el("div", {
      className: "empty",
      textContent: "Henüz tarihsel veri yok.",
    }));
    $("hist-count").textContent = "";
    return;
  }
  $("hist-count").textContent = data.days_present + " gün";
  const tbl = el("table", { className: "history-table" });
  const thead = el("thead");
  thead.appendChild(el("tr", null,
    el("th", { textContent: "Gün" }),
    el("th", { textContent: "Pred/Sonuç" }),
    el("th", { textContent: "Banker hayatta" }),
    el("th", { textContent: "Aday top-4" }),
    el("th", { textContent: "Wide hit" }),
    el("th", { textContent: "Pas" }),
  ));
  tbl.appendChild(thead);
  const tbody = el("tbody");
  for (const r of data.rows) {
    const s = r.shadow || {};
    tbody.appendChild(el("tr", null,
      el("td", { textContent: r.date }),
      el("td", { textContent: (s.predictions || 0) + " / " + (s.results || 0) }),
      el("td", { textContent: (s.banker_survived || 0) + " ("
                 + pct(s.banker_survived, s.results) + ")" }),
      el("td", { textContent: (s.candidate_hit || 0) + " ("
                 + pct(s.candidate_hit, s.results) + ")" }),
      el("td", { textContent: (s.wide_hit || 0) + " ("
                 + pct(s.wide_hit, s.results) + ")" }),
      el("td", { textContent: s.no_bet || 0 }),
    ));
  }
  tbl.appendChild(tbody);
  box.appendChild(tbl);
}

function renderTelegramMessages(msgs) {
  const box = $("tg-content");
  box.innerHTML = "";
  $("tg-count").textContent = (msgs ? msgs.length : 0);
  if (!msgs || msgs.length === 0) {
    box.appendChild(el("div", {
      className: "empty",
      textContent: "Henüz mesaj kaydı yok.",
    }));
    return;
  }
  for (const m of msgs) {
    const div = el("div", { className: "telegram-msg" });
    div.appendChild(el("div", { className: "head",
      textContent: "[" + (m.category || "MSG") + "] " + (m.title || "") }));
    const pre = el("pre", { className: "coupon-text" });
    pre.textContent = (m.text || "").replace(/<[^>]+>/g, "");
    div.appendChild(pre);
    box.appendChild(div);
  }
}

function renderModelOutputs(data) {
  const box = $("model-content");
  box.innerHTML = "";
  const hippos = (data && data.hippos) || [];
  $("model-count").textContent = hippos.length + " hipodrom";
  if (!hippos.length) {
    box.appendChild(el("div", {
      className: "empty",
      textContent: "Bugün pool yok.",
    }));
    return;
  }
  for (const h of hippos) {
    const det = el("details");
    const sum = el("summary", null,
      document.createTextNode(h.hippo + " · " + (h.first_time || "")
        + " · " + (h.n_legs || h.race_legs?.length || 0) + " ayak"
        + " · " + (h.cost_tl ? Math.round(h.cost_tl) + " TL" : "—")),
    );
    det.appendChild(sum);
    const body = el("div", { className: "content" });
    const legs = h.race_legs || [];
    let legIdx = 0;
    for (const leg of legs) {
      legIdx++;
      if (!leg || !leg.length) continue;
      const h0 = leg[0];
      const time = (h0.start_time || "").substring(0, 5);
      const raceNo = h0.race_number || legIdx;
      body.appendChild(el("div", {
        style: "color:#58a6ff; font-weight:600; margin-top:10px; font-size:0.88em;",
        textContent: legIdx + ". ayak · " + raceNo + ". koşu · " + time,
      }));
      const tbl = el("table", { style: "width:100%; font-size:0.8em; border-collapse:collapse;" });
      const horses = [...leg].sort((a, b) => (b.agf_value || 0) - (a.agf_value || 0));
      const trHead = el("tr", null);
      ["#", "At", "AGF", "Model", "Tier"].forEach(t => trHead.appendChild(
        el("th", { textContent: t,
          style: "text-align:left; color:#8b949e; font-size:0.85em; padding:3px 5px; border-bottom:1px solid #30363d;" })
      ));
      tbl.appendChild(trHead);
      for (const hr of horses) {
        tbl.appendChild(el("tr", null,
          el("td", { textContent: "#" + (hr.horse_number || hr.no || "?"),
            style: "padding:3px 5px; border-bottom:1px solid #21262d;" }),
          el("td", { textContent: hr.horse_name || hr.name || "?",
            style: "padding:3px 5px; border-bottom:1px solid #21262d;" }),
          el("td", { textContent: "%" + (hr.agf_value != null
            ? hr.agf_value.toFixed(1) : "—"),
            style: "padding:3px 5px; border-bottom:1px solid #21262d;" }),
          el("td", { textContent: hr.model_prob != null
            ? hr.model_prob.toFixed(3) : "—",
            style: "padding:3px 5px; border-bottom:1px solid #21262d;" }),
          el("td", { textContent: hr.tier_mark || "—",
            style: "padding:3px 5px; border-bottom:1px solid #21262d;" }),
        ));
      }
      body.appendChild(tbl);
    }
    det.appendChild(body);
    box.appendChild(det);
  }
}

function renderSibContent(rows) {
  const box = $("sib-content");
  box.innerHTML = "";
  $("sib-count").textContent = (rows ? rows.length : 0);
  if (!rows || rows.length === 0) {
    box.appendChild(el("div", {
      className: "empty",
      textContent: "Henüz SİB pick'i yok. Butona basarak canlı çek.",
    }));
    return;
  }
  const tbl = el("table", { className: "picks-table" });
  const thead = el("thead");
  thead.appendChild(el("tr", null,
    el("th", { textContent: "Tier" }),
    el("th", { textContent: "Yarış" }),
    el("th", { textContent: "At" }),
    el("th", { textContent: "AGF/MP" }),
    el("th", { textContent: "Sonuç" }),
  ));
  tbl.appendChild(thead);
  const tbody = el("tbody");
  for (const r of rows) {
    const tier = (r.tier || "").toUpperCase();
    const won = (r.outcome || {}).won;
    let trCls = "";
    if (won === true) trCls = "won";
    else if (won === false) trCls = "lost";
    tbody.appendChild(el("tr", { className: trCls },
      el("td", null, el("span", {
        className: "tier-badge tier-" + tier, textContent: tier })),
      el("td", { textContent: (r.hippo || "?") + " " + (r.race_no || "?") + ".k " + (r.race_time || "") }),
      el("td", { textContent: "#" + r.horse_no + " " + (r.horse_name || "?") }),
      el("td", { textContent: "%" + (r.agf != null ? r.agf : "—")
                 + " · MP " + (r.mp != null ? r.mp : "—") }),
      el("td", {
        className: "pick-outcome " + (won === true ? "won" : won === false ? "lost" : "pending"),
        textContent: won === true ? "✓" : won === false ? "✗" : "—",
      }),
    ));
  }
  tbl.appendChild(tbody);
  box.appendChild(tbl);
}

async function refreshSib() {
  const status = $("sib-status");
  const btn = $("sib-refresh-btn");
  btn.disabled = true;
  status.textContent = "30 saniye kadar sürebilir…";
  try {
    const r = await fetch("/api/berkay_deneme/refresh_sib?force=1",
                          { method: "POST" });
    const data = await r.json();
    if (data.status === "fresh") {
      const tot = (data.diamond || 0) + (data.altin || 0)
                  + (data.premium || 0) + (data.firsat || 0);
      status.textContent = "✓ " + tot + " pick eklendi";
      status.style.color = "#56d364";
      load($("date-picker").value);
    } else {
      status.textContent = data.status + " — " + (data.reason || "");
      status.style.color = "#d29922";
    }
  } catch (e) {
    status.textContent = "Hata: " + e;
    status.style.color = "#f85149";
  } finally {
    btn.disabled = false;
  }
}

async function load(dateStr) {
  renderHeader(dateStr || new Date().toISOString().slice(0, 10));
  // 1) Main view (fast)
  try {
    const url = dateStr
      ? "/api/berkay_deneme/today?date=" + encodeURIComponent(dateStr)
      : "/api/berkay_deneme/today";
    const r = await fetch(url);
    const data = await r.json();
    renderStats(data.stats);
    renderPicks(data.picks);
    renderTelegramMessages(data.telegram_messages || []);
    renderSibContent((data.sib && data.sib.rows) || []);
    $("disclaimer").textContent = data.disclaimer || "";
  } catch (e) {
    $("picks-body").innerHTML =
      '<div class="empty">Yüklenemedi: ' + e + '</div>';
  }
  // 2) History (separate)
  try {
    const r = await fetch("/api/berkay_deneme/history?days=14");
    const data = await r.json();
    renderHistory(data);
  } catch (e) {
    $("hist-body").innerHTML =
      '<div class="empty">Geçmiş yüklenemedi: ' + e + '</div>';
  }
  // 3) Model outputs (slow, separate)
  try {
    const today = dateStr || new Date().toISOString().slice(0, 10);
    const r = await fetch("/api/smart_coupon/all/" + today);
    const data = await r.json();
    renderModelOutputs(data);
  } catch (e) {
    $("model-content").innerHTML =
      '<div class="empty">Model çıktıları yüklenemedi: ' + e + '</div>';
  }
}

document.addEventListener("DOMContentLoaded", function () {
  const today = new Date().toISOString().slice(0, 10);
  $("date-picker").value = today;
  $("date-picker").addEventListener("change", function () { load(this.value); });
  $("refresh-btn").addEventListener("click", function () { load($("date-picker").value); });
  $("sib-refresh-btn").addEventListener("click", refreshSib);
  load(today);
});
</script>
